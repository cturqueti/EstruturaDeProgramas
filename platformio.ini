; Descrição: Este arquivo contém as configurações do projeto para o PlatformIO.
;
; O que pode ser adicionar:
; Configurações da plataforma (por exemplo, espressif32 para ESP32).
; Bibliotecas externas.
; Configurações de compilação.
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev_OTA]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = default
monitor_flags =
    --echo
upload_protocol = espota
upload_port = 192.168.0.146
upload_flags =
    --auth=otapassword
lib_deps =
    ;external_lib1   ; biblioteca na pasta lib
    ;external_lib2   ; biblioteca na pasta lib
    pubsubclient    ; biblioteca instalado automaticamente na pasta .pio/libdeps
    ArduinoOTA
    ESPmDNS
    ArduinoJson
    https://github.com/cturqueti/LogLibrary


[env:esp32dev_Serial]
platform = espressif32
board = esp32dev
board_build.filesystem = littlefs
framework = arduino
monitor_speed = 115200
monitor_filters = default
monitor_options =
    ;--encoding utf-8
    ;--echo

build_flags =
    -fexceptions  ; Habilita tratamento de exceções
    -DUSE_EXCEPTIONS=1
    ;-std=gnu++11  ; ou gnu++14, gnu++17, etc.

lib_deps =
    ;file://C:/Users/Carlos/Documents/GitHub/Projects/BibliotecaMotorControl/
    ;external_lib1   ; biblioteca na pasta lib
    ;external_lib2   ; biblioteca na pasta lib
    pubsubclient    ; biblioteca instalado automaticamente na pasta .pio/libdeps
    ArduinoOTA
    ESPmDNS
    ArduinoJson
    https://github.com/cturqueti/LogLibrary.git
    https://github.com/cturqueti/BLDCMotor.git

[env:esp32s3dev_Serial]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 9600
monitor_filters = default
    
lib_deps =
    external_lib1   ; biblioteca na pasta lib
    external_lib2   ; biblioteca na pasta lib
    pubsubclient    ; biblioteca instalado automaticamente na pasta .pio/libdeps
    ArduinoOTA
    ESPmDNS
    ArduinoJson
    esp32
    https://github.com/cturqueti/LogLibrary
    https://github.com/cturqueti/BLDCMotor.git

build_flags =
    -D CONFIG_IDF_TARGET_ESP32S3
    -D ARDUINO_USB_MODE=1           ; Habilita USB nativo (se suportado)
    -D ARDUINO_USB_CDC_ON_BOOT=1    ; Habilita CDC serial via USB
